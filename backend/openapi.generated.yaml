components:
  schemas:
    Account:
      properties:
        id:
          type: string
          title: Id
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        connectionMode:
          type: string
          title: Connectionmode
        awsAccountId:
          type: string
          title: Awsaccountid
        roleArn:
          anyOf:
          - type: string
          - type: 'null'
          title: Rolearn
        scanRegions:
          items:
            type: string
          type: array
          title: Scanregions
        status:
          type: string
          title: Status
        lastScan:
          anyOf:
          - $ref: '#/components/schemas/ScanSummary'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - connectionMode
      - awsAccountId
      - scanRegions
      - status
      - createdAt
      title: Account
    AccountCreate:
      properties:
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        connectionMode:
          $ref: '#/components/schemas/ConnectionMode'
        awsAccountId:
          anyOf:
          - type: string
          - type: 'null'
          title: Awsaccountid
        roleArn:
          anyOf:
          - type: string
          - type: 'null'
          title: Rolearn
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        scanRegions:
          items:
            type: string
          type: array
          title: Scanregions
      additionalProperties: false
      type: object
      required:
      - connectionMode
      title: AccountCreate
      description: FR-006. `extra="forbid"` is FR-001's structural refusal of access-key
        input.
    AccountUpdate:
      properties:
        scanRegions:
          items:
            type: string
          type: array
          minItems: 1
          title: Scanregions
      additionalProperties: false
      type: object
      required:
      - scanRegions
      title: AccountUpdate
    AccountsList:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/Account'
          type: array
          title: Accounts
      type: object
      required:
      - accounts
      title: AccountsList
    ComplianceScore:
      properties:
        compliantCount:
          type: integer
          title: Compliantcount
        totalCount:
          type: integer
          title: Totalcount
        score:
          type: number
          title: Score
      type: object
      required:
      - compliantCount
      - totalCount
      - score
      title: ComplianceScore
    ConnectionMode:
      type: string
      enum:
      - local
      - assume_role
      title: ConnectionMode
      description: 'FR-031-adjacent: how the platform reaches a scanned account.


        Both modes are roles-only. There is deliberately no mode that accepts an access

        key -- Principle III forbids storing one, so it is absent from the vocabulary

        rather than merely discouraged.'
    CurrentUser:
      properties:
        userId:
          type: string
          title: Userid
        email:
          type: string
          title: Email
        displayName:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayname
        role:
          type: string
          title: Role
          description: Derived from directory group membership; never stored by the
            platform.
        tenantId:
          type: string
          title: Tenantid
      type: object
      required:
      - userId
      - email
      - role
      - tenantId
      title: CurrentUser
    DependencyCheck:
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          title: Status
        detailMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Detailmessage
          description: Never contains credentials, connection strings, or secrets
            (FR-046).
      type: object
      required:
      - name
      - status
      title: DependencyCheck
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable and machine-readable. SCREAMING_SNAKE_CASE.
        message:
          type: string
          title: Message
          description: Human-readable and safe to display. Never reveals whether a
            given record exists to a caller not entitled to know (FR-035).
        correlationId:
          type: string
          title: Correlationid
          description: Matches the id in the structured logs for this request (FR-044).
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorDetail'
            type: array
          - type: 'null'
          title: Details
          description: Field-level detail. Present for validation failures only.
      type: object
      required:
      - code
      - message
      - correlationId
      title: ErrorBody
    ErrorDetail:
      properties:
        field:
          type: string
          title: Field
        issue:
          type: string
          title: Issue
      type: object
      required:
      - field
      - issue
      title: ErrorDetail
      description: One field-level validation problem.
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorEnvelope
      description: 'The uniform error envelope (FR-043).


        Declared as a model, not just built as a dict, so it appears in the **generated**

        OpenAPI document -- which FR-048 makes the binding contract. An envelope that
        only

        exists at runtime would be invisible to the generated client, leaving every

        consumer to hand-roll the error type.'
    ExternalIdResponse:
      properties:
        externalId:
          type: string
          title: Externalid
        cloudFormationTemplateUrl:
          type: string
          title: Cloudformationtemplateurl
      type: object
      required:
      - externalId
      - cloudFormationTemplateUrl
      title: ExternalIdResponse
    Finding:
      properties:
        id:
          type: string
          title: Id
        resource:
          $ref: '#/components/schemas/ResourceSummary'
        ruleKey:
          type: string
          title: Rulekey
        ruleVersion:
          type: integer
          title: Ruleversion
        severity:
          type: string
          title: Severity
        status:
          type: string
          title: Status
        openedAt:
          type: string
          format: date-time
          title: Openedat
        resolvedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolvedat
        acknowledgedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Acknowledgedat
        acknowledgedBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Acknowledgedby
      type: object
      required:
      - id
      - resource
      - ruleKey
      - ruleVersion
      - severity
      - status
      - openedAt
      title: Finding
    FindingAcknowledgment:
      properties:
        findingId:
          type: string
          title: Findingid
        acknowledgedAt:
          type: string
          format: date-time
          title: Acknowledgedat
        acknowledgedBy:
          type: string
          title: Acknowledgedby
      type: object
      required:
      - findingId
      - acknowledgedAt
      - acknowledgedBy
      title: FindingAcknowledgment
    FindingStatus:
      type: string
      enum:
      - open
      - resolved
      - suppressed
      title: FindingStatus
      description: 'Spec 003 owns the lifecycle semantics (FR-055).


        These members are the schema''s accommodation of them, not the authoritative

        definition. Spec 003 may extend this enum by additive migration without

        renegotiating the table.'
    FindingsList:
      properties:
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Findings
      type: object
      required:
      - findings
      title: FindingsList
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          title: Status
        checks:
          items:
            $ref: '#/components/schemas/DependencyCheck'
          type: array
          title: Checks
        correlationId:
          type: string
          title: Correlationid
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      type: object
      required:
      - status
      - checks
      - correlationId
      title: HealthResponse
    InventoryResourceSummary:
      properties:
        id:
          type: string
          title: Id
        accountId:
          type: string
          title: Accountid
        arn:
          type: string
          title: Arn
        resourceType:
          type: string
          title: Resourcetype
        service:
          type: string
          title: Service
        region:
          type: string
          title: Region
        sdaId:
          anyOf:
          - type: string
          - type: 'null'
          title: Sdaid
        tagStatus:
          type: string
          title: Tagstatus
        ownerStatus:
          type: string
          title: Ownerstatus
      type: object
      required:
      - id
      - accountId
      - arn
      - resourceType
      - service
      - region
      - tagStatus
      - ownerStatus
      title: InventoryResourceSummary
    OwnerIdentityOverrideBody:
      properties:
        principalId:
          type: string
          title: Principalid
        ownerEmail:
          type: string
          title: Owneremail
      type: object
      required:
      - principalId
      - ownerEmail
      title: OwnerIdentityOverrideBody
    OwnerIdentityOverridesList:
      properties:
        overrides:
          items:
            $ref: '#/components/schemas/OwnerIdentityOverrideBody'
          type: array
          title: Overrides
      type: object
