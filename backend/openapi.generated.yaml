openapi: 3.1.0
info:
  title: CloudPulse AI API
  description: 'Serverless cloud governance, cost, and compliance platform for AWS.


    Every endpoint except `/health` requires a Cognito-issued bearer token. The caller''s

    role is derived from directory group membership on every request and is never
    stored by

    the platform (FR-031a). A token whose group claim contains zero or more than one
    mapped

    group is refused (FR-032a).

    '
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Service and dependency health
      description: Report this service's health and that of its dependencies.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one dependency is unreachable (FR-042)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /me:
    get:
      tags:
      - identity
      summary: The signed-in caller and their resolved role
      description: "Any caller with exactly one resolved role may read this, and no\
        \ one else.\n\nA caller mapping to zero or multiple directory groups never\
        \ reaches here \u2014\n`get_principal` raises 403 first (FR-032a)."
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts/external-id:
    post:
      tags:
      - accounts
      summary: Get a fresh platform-generated ExternalId ahead of cross-account registration
      description: T016a. Admin only, deliberately stateless -- see module and openapi.yaml
        docs.
      operationId: generateExternalId
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalIdResponse'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts:
    get:
      tags:
      - accounts
      summary: List every registered account
      description: FR-010/FR-010a. All three roles may view.
      operationId: listAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - accounts
      summary: Register a new AWS account
      description: FR-006/FR-007/FR-011a. Verifies before accepting; refuses a duplicate
        (FR-009).
      operationId: registerAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with the account's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts/{account_id}:
    patch:
      tags:
      - accounts
      summary: Edit an account's scan-region list
      description: FR-008/FR-011a. Admin only. Takes effect from the next scan onward.
      operationId: updateAccountRegions
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/deactivate:
    post:
      tags:
      - accounts
      summary: Stop scanning an account without deleting its history
      description: 'FR-009a/FR-011a. A scan already running is unaffected (FR-009b)
        -- this only

        changes `cloud_account.status`, which the next scheduler pass reads, not the

        in-flight execution.'
      operationId: deactivateAccount
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/reactivate:
    post:
      tags:
      - accounts
      summary: Resume scanning a deactivated account
      description: 'FR-009c/FR-011a. No re-registration, no re-verification -- a stale
        role is

        caught by the same scan-failure handling that covers any active account

        (Edge Cases), on the next scan attempt.'
      operationId: reactivateAccount
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with the account's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/scans:
    post:
      tags:
      - accounts
      summary: Trigger an on-demand scan
      description: 'FR-026/FR-026a. Operator only -- research.md R-205''s non-hierarchical-roles

        point, made concrete: admin''s account-management grant does not include this.'
      operationId: triggerScan
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with the account's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Account:
      properties:
        id:
          type: string
          title: Id
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        connectionMode:
          type: string
          title: Connectionmode
        awsAccountId:
          type: string
          title: Awsaccountid
        roleArn:
          anyOf:
          - type: string
          - type: 'null'
          title: Rolearn
        scanRegions:
          items:
            type: string
          type: array
          title: Scanregions
        status:
          type: string
          title: Status
        lastScan:
          anyOf:
          - $ref: '#/components/schemas/ScanSummary'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - connectionMode
      - awsAccountId
      - scanRegions
      - status
      - createdAt
      title: Account
    AccountCreate:
      properties:
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        connectionMode:
          $ref: '#/components/schemas/ConnectionMode'
        awsAccountId:
          anyOf:
          - type: string
          - type: 'null'
          title: Awsaccountid
        roleArn:
          anyOf:
          - type: string
          - type: 'null'
          title: Rolearn
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        scanRegions:
          items:
            type: string
          type: array
          title: Scanregions
      additionalProperties: false
      type: object
      required:
      - connectionMode
      title: AccountCreate
      description: FR-006. `extra="forbid"` is FR-001's structural refusal of access-key
        input.
    AccountUpdate:
      properties:
        scanRegions:
          items:
            type: string
          type: array
          minItems: 1
          title: Scanregions
      additionalProperties: false
      type: object
      required:
      - scanRegions
      title: AccountUpdate
    AccountsList:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/Account'
          type: array
          title: Accounts
      type: object
      required:
      - accounts
      title: AccountsList
    ConnectionMode:
      type: string
      enum:
      - local
      - assume_role
      title: ConnectionMode
      description: 'FR-031-adjacent: how the platform reaches a scanned account.


        Both modes are roles-only. There is deliberately no mode that accepts an access

        key -- Principle III forbids storing one, so it is absent from the vocabulary

        rather than merely discouraged.'
    CurrentUser:
      properties:
        userId:
          type: string
          title: Userid
        email:
          type: string
          title: Email
        displayName:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayname
        role:
          type: string
          title: Role
          description: Derived from directory group membership; never stored by the
            platform.
        tenantId:
          type: string
          title: Tenantid
      type: object
      required:
      - userId
      - email
      - role
      - tenantId
      title: CurrentUser
    DependencyCheck:
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          title: Status
        detailMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Detailmessage
          description: Never contains credentials, connection strings, or secrets
            (FR-046).
      type: object
      required:
      - name
      - status
      title: DependencyCheck
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable and machine-readable. SCREAMING_SNAKE_CASE.
        message:
          type: string
          title: Message
          description: Human-readable and safe to display. Never reveals whether a
            given record exists to a caller not entitled to know (FR-035).
        correlationId:
          type: string
          title: Correlationid
          description: Matches the id in the structured logs for this request (FR-044).
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorDetail'
            type: array
          - type: 'null'
          title: Details
          description: Field-level detail. Present for validation failures only.
      type: object
      required:
      - code
      - message
      - correlationId
      title: ErrorBody
    ErrorDetail:
      properties:
        field:
          type: string
          title: Field
        issue:
          type: string
          title: Issue
      type: object
      required:
      - field
      - issue
      title: ErrorDetail
      description: One field-level validation problem.
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorEnvelope
      description: 'The uniform error envelope (FR-043).


        Declared as a model, not just built as a dict, so it appears in the **generated**

        OpenAPI document -- which FR-048 makes the binding contract. An envelope that
        only

        exists at runtime would be invisible to the generated client, leaving every

        consumer to hand-roll the error type.'
    ExternalIdResponse:
      properties:
        externalId:
          type: string
          title: Externalid
        cloudFormationTemplateUrl:
          type: string
          title: Cloudformationtemplateurl
      type: object
      required:
      - externalId
      - cloudFormationTemplateUrl
      title: ExternalIdResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - healthy
          - unhealthy
          title: Status
        checks:
          items:
            $ref: '#/components/schemas/DependencyCheck'
          type: array
          title: Checks
        correlationId:
          type: string
          title: Correlationid
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      type: object
      required:
      - status
      - checks
      - correlationId
      title: HealthResponse
    Scan:
      properties:
        id:
          type: string
          title: Id
        accountId:
          type: string
          title: Accountid
        trigger:
          type: string
          title: Trigger
        status:
          type: string
          title: Status
        startedAt:
          type: string
          format: date-time
          title: Startedat
        finishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finishedat
        resourceCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resourcecount
      type: object
      required:
      - id
      - accountId
      - trigger
      - status
      - startedAt
      title: Scan
    ScanSummary:
      properties:
        status:
          type: string
          title: Status
        startedAt:
          type: string
          format: date-time
          title: Startedat
        finishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finishedat
        resourceCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resourcecount
      type: object
      required:
      - status
      - startedAt
      title: ScanSummary
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito-issued access token. Validated by the API Gateway JWT authorizer,
        then re-validated for role cardinality by the application (research.md R-004).
security:
- cognitoJwt: []
