openapi: 3.1.0
info:
  title: CloudPulse AI API
  description: 'Serverless cloud governance, cost, and compliance platform for AWS.


    Every endpoint except `/health` requires a Cognito-issued bearer token. The caller''s

    role is derived from directory group membership on every request and is never
    stored by

    the platform (FR-031a). A token whose group claim contains zero or more than one
    mapped

    group is refused (FR-032a).

    '
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Service and dependency health
      description: Report this service's health and that of its dependencies.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one dependency is unreachable (FR-042)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /me:
    get:
      tags:
      - identity
      summary: The signed-in caller and their resolved role
      description: "Any caller with exactly one resolved role may read this, and no\
        \ one else.\n\nA caller mapping to zero or multiple directory groups never\
        \ reaches here \u2014\n`get_principal` raises 403 first (FR-032a)."
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts/external-id:
    post:
      tags:
      - accounts
      summary: Get a fresh platform-generated ExternalId ahead of cross-account registration
      description: T016a. Admin only, deliberately stateless -- see module and openapi.yaml
        docs.
      operationId: generateExternalId
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalIdResponse'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts:
    get:
      tags:
      - accounts
      summary: List every registered account
      description: FR-010/FR-010a. All three roles may view.
      operationId: listAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - accounts
      summary: Register a new AWS account
      description: FR-006/FR-007/FR-011a. Verifies before accepting; refuses a duplicate
        (FR-009).
      operationId: registerAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with the account's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /accounts/{account_id}:
    patch:
      tags:
      - accounts
      summary: Edit an account's scan-region list
      description: FR-008/FR-011a. Admin only. Takes effect from the next scan onward.
      operationId: updateAccountRegions
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/deactivate:
    post:
      tags:
      - accounts
      summary: Stop scanning an account without deleting its history
      description: 'FR-009a/FR-011a. A scan already running is unaffected (FR-009b)
        -- this only

        changes `cloud_account.status`, which the next scheduler pass reads, not the

        in-flight execution.'
      operationId: deactivateAccount
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/reactivate:
    post:
      tags:
      - accounts
      summary: Resume scanning a deactivated account
      description: 'FR-009c/FR-011a. No re-registration, no re-verification -- a stale
        role is

        caught by the same scan-failure handling that covers any active account

        (Edge Cases), on the next scan attempt.'
      operationId: reactivateAccount
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with the account's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/scans:
    post:
      tags:
      - accounts
      summary: Trigger an on-demand scan
      description: 'FR-026/FR-026a. Operator only -- research.md R-205''s non-hierarchical-roles

        point, made concrete: admin''s account-management grant does not include this.'
      operationId: triggerScan
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The request conflicts with the account's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - accounts
      summary: Retrieve an account's scan history
      description: 'FR-033. Any role may view, same as the accounts list itself (FR-010a)
        --

        read access here carries no more privilege than seeing an account exists.'
      operationId: listScanHistory
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScansList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /rules:
    get:
      tags:
      - rules
      summary: List every tagging rule
      description: 'FR-001-FR-004. All three roles may view (FR-030). One row per
        key -- the

        latest version, via `DISTINCT ON` ordered by version descending.'
      operationId: listRules
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - rules
      summary: Create a new tagging rule
      description: 'FR-001. Admin only (FR-029). Refused if the key already exists
        -- editing an

        existing key is PATCH''s job (FR-006), not a second POST.'
      operationId: createRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: A rule with this key is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /rules/{rule_key}:
    patch:
      tags:
      - rules
      summary: Edit a tagging rule
      description: 'FR-005/FR-006. Admin only. Creates a new version under the same
        key

        (research.md R-301) rather than mutating the existing version in place --
        the

        edit takes effect starting with the next scan that begins after this call,
        never

        a scan already in progress (Clarifications session 2026-08-25).'
      operationId: updateRule
      parameters:
      - name: rule_key
        in: path
        required: true
        schema:
          type: string
          title: Rule Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /sdas:
    get:
      tags:
      - sdas
      summary: List every registered SDA
      description: FR-007. Any role may view (FR-030).
      operationId: listSdas
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdasList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - sdas
      summary: Register a new SDA
      description: 'FR-007. Admin only (FR-029). Refused with 409 if the mapping overlaps
        an

        existing SDA''s (FR-010a).'
      operationId: registerSda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SdaCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sda'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: This tag-value mapping overlaps an already-registered SDA's
            mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /sdas/{sda_id}:
    patch:
      tags:
      - sdas
      summary: Edit an SDA's tag-value mapping
      description: 'FR-010. Admin only. Reclassification of matching resources happens
        at the

        next scan (Phase 7''s worker calls `sda_matching.reclassify_account_resources`),

        not here -- this endpoint only updates the SDA row itself.'
      operationId: updateSda
      parameters:
      - name: sda_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sda Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SdaUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sda'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: This tag-value mapping overlaps an already-registered SDA's
            mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sdas
      summary: Remove an SDA
      description: 'FR-010b. Admin only. Never refused for having attached resources
        -- the

        `ON DELETE SET NULL` foreign key is what immediately reverts every attached

        resource to the "No SDA" bucket, not application code, and not deferred to

        the next scan (Acceptance Scenario US2.5).'
      operationId: removeSda
      parameters:
      - name: sda_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sda Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target record does not exist, or the caller is not entitled
            to know that it does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sdas/unmatched-resources:
    get:
      tags:
      - sdas
      summary: List resources in the "No SDA" bucket
      description: 'FR-009/FR-012. Any role may view (FR-030) -- the P1 API the P2
        triage

        screen (FR-012) consumes; this endpoint itself is P1 since FR-009''s

        visibility requirement is P1.'
      operationId: listUnmatchedResources
      parameters:
      - name: accountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Accountid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmatchedResourcesList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /findings:
    get:
      tags:
      - findings
      summary: List findings
      description: FR-014. Any role may view (FR-030). Most recently opened first.
      operationId: listFindings
      parameters:
      - name: accountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Accountid
      - name: resourceId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Resourceid
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FindingStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsList'
        '401':
          description: No valid identity presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Valid identity, but the caller's role does not permit the action
            -- or the caller maps to zero or multiple directory groups and therefore
            has no resolvable role (FR-032a, FR-034).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /findings/{finding_id}/acknowledge:
    post:
      tags:
      - findings
      summary: Acknowledge an open finding
      description: 'FR-015-FR-017, FR-020, FR-028. Admin or operator only. Never touches

        `status` or any compliance score (FR-017). Idempotent: the `WHERE

        acknowledged_at IS NULL` guard means a near-simultaneous second attempt

        updates nothing rather than racing or duplicating (data-model.md).'
      operationId: acknowledgeFinding
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Finding Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingAcknowledgment'
        '401':
          description: No valid identity presented.
          content:
            application/json:
