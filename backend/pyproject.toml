[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpulse-backend"
version = "0.1.0"
description = "CloudPulse AI — serverless cloud governance, cost and compliance platform for AWS"
requires-python = "==3.12.*"

# Runtime dependencies.
#
# Constitution Principle II (NON-NEGOTIABLE): the deployed system runs on AWS managed
# services only, and the product GenAI layer is Amazon Bedrock Agents exclusively.
# No non-AWS inference, model-hosting, or agent-framework SDK may appear here or in any
# other dependency manifest. FR-013a enforces this with an automated CI allowlist gate --
# see ops/ci-fixtures/ and the `dependency-allowlist` job in .github/workflows/ci.yml.
dependencies = [
    "fastapi>=0.115,<0.116",
    "mangum>=0.19,<0.20",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "aws-lambda-powertools>=3.0,<4",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "moto[all]>=5.0,<6",
    "testcontainers[postgres]>=4.8,<5",
    "httpx>=0.27,<0.28",
    "pyjwt[crypto]>=2.9,<3",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
    "types-boto3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "connectors*", "handlers*"]

# ---------------------------------------------------------------------------
# ruff -- lint + format. FR-009 check category 1.
# FR-012: failures must name the file and line, which ruff does by default.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "S",         # bandit -- security
    "T20",       # no print()
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests may use hardcoded fake credentials as fixtures; the credential scan
# (FR-013) and the ci-fixtures allowlist cover real leaks.
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# FR-054: no cloud-provider SDK type may cross out of backend/connectors/.
# Enforced repo-wide by the `connector-boundary` CI job; this is the local mirror.
"botocore.client" = { msg = "Provider SDK types must not leak outside backend/connectors/ (FR-054)." }

# ---------------------------------------------------------------------------
# mypy -- static typing. FR-009 check category 2.
# Principle V: typed contracts at every boundary, so strict is the default.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true          # FR-012: name the file, line and column
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*", "testcontainers.*", "mangum.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest -- FR-009 check category 3, FR-010 (no real credentials).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs Docker (Testcontainers PostgreSQL / LocalStack). Excluded from the unit job.",
]
