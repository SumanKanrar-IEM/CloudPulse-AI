# Continuous delivery to dev (FR-015, FR-016, FR-022, FR-023).
#
# A merge to the trunk reaches dev with NO human action, IF the DEV_AUTO_DEPLOY repo
# variable is "true" (FR-015 amendment, 2026-08-23). This account has no free tier, so
# an unconditional auto-deploy on every trunk push silently re-provisions a torn-down
# dev environment and starts billing again -- discovered when merging a docs-only PR
# undid a deliberate teardown. The variable defaults unset (deploy skipped) precisely
# so teardown stays torn down until a verification session explicitly turns it back on.
# `workflow_dispatch` always runs regardless of the variable -- that IS the explicit
# trigger. SC-005 budgets 15 minutes end to end for whichever run actually deploys.
#
# Constitution Principle VII: pods/pod73 is the only long-lived branch. This workflow
# does not reference main or master.

name: Deploy dev

on:
  push:
    branches: [pods/pod73]
  workflow_dispatch:

# FR-022: OIDC federation only. No AWS access key exists anywhere in this repository.
permissions:
  contents: read
  id-token: write

# FR-020: deployments are serialised per environment, so two merges seconds apart
# cannot interleave and leave dev running a mixture of two versions.
# cancel-in-progress is deliberately FALSE: cancelling mid-apply is exactly how an
# environment ends up in the unknown state FR-021 forbids.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    # Skip on an ordinary trunk push unless the toggle is explicitly on; a manual
    # dispatch is already the explicit action the toggle exists to require.
    if: github.event_name == 'workflow_dispatch' || vars.DEV_AUTO_DEPLOY == 'true'
    outputs:
      deployment_id: ${{ steps.record_start.outputs.deployment_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudpulse-deploy-dev-${{ github.run_id }}

      # --- Build the Lambda package ------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build the deployment package
        working-directory: backend
        run: |
          mkdir -p build dist
          pip install --target build --only-binary=:all: --platform manylinux2014_aarch64 \
            --python-version ${{ env.PYTHON_VERSION }} -r <(pip install -q pip-tools >/dev/null 2>&1; \
            python -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          cp -r app connectors handlers migrations alembic.ini build/
          (cd build && zip -qr ../dist/lambda.zip .)
          echo "PACKAGE_HASH=$(openssl dgst -sha256 -binary dist/lambda.zip | base64)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      # --- Apply infrastructure ----------------------------------------
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform apply
        id: apply
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="package_path=../../../backend/dist/lambda.zip" \
            -var="package_hash=${PACKAGE_HASH}" \
            -var="git_sha=${GITHUB_SHA}"
          {
            echo "migrate_function=$(terraform output -raw migrate_function_name)"
            echo "frontend_bucket=$(terraform output -raw frontend_bucket)"
            echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "api_endpoint=$(terraform output -raw api_endpoint)"
            echo "frontend_url=$(terraform output -raw frontend_url)"
            echo "cognito_client_id=$(terraform output -raw cognito_client_id)"
            echo "cognito_hosted_ui_domain=$(terraform output -raw cognito_hosted_ui_domain)"
          } >> "$GITHUB_OUTPUT"

      # --- Migrations BEFORE traffic shifts, and before the deployment record
      # (FR-016) ----------------------------------------------------------
      # research.md R-002: the runner cannot reach the private Aurora cluster, so this
      # goes through a Lambda already inside the VPC. A non-zero result fails the
      # deployment here, before the new API version serves anything.
      #
      # Runs BEFORE "Record deployment start", not after: the deployment record looks
      # up the seeded tenant, and on a brand-new database that row -- and the table
      # itself -- do not exist until migrations create them. Recording first would be
      # a chicken-and-egg failure on every environment's very first deployment.
      # `command.upgrade(head)` is idempotent, so this is a no-op on every later run.
      - name: Apply database migrations
        id: migrate
        run: |
          aws lambda invoke --function-name "${{ steps.apply.outputs.migrate_function }}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"command":"upgrade","revision":"head"}' /tmp/migrate.json
          cat /tmp/migrate.json
          if [ "$(jq -r '.ok' /tmp/migrate.json)" != "true" ]; then
            echo "::error::Migration failed. The previous service version is still serving (FR-021)."
            exit 1
          fi

      # --- Open the deployment record (FR-023) -------------------------
      - name: Record deployment start
        id: record_start
        run: |
          # A real file, never /dev/stdout: the CLI's own status metadata
          # ({"StatusCode":200,...}) and the Lambda's response payload would otherwise
          # land on the SAME stream and concatenate into two JSON documents on one
          # line. jq then silently evaluates .deployment_id against both, emitting
          # "null" twice -- and the second "null" is not valid key=value output
          # syntax, which fails the step with a bare "Invalid format 'null'" that
          # gives no hint the real cause is upstream.
          aws lambda invoke --function-name "${{ steps.apply.outputs.migrate_function }}" \
            --cli-binary-format raw-in-base64-out \
            --payload "$(jq -nc --arg sha "$GITHUB_SHA" --arg who "$GITHUB_ACTOR" \
              '{command:"record_start",environment:"dev",git_sha:$sha,triggered_by:$who}')" \
            /tmp/record_start.json
          cat /tmp/record_start.json
          if [ "$(jq -r '.ok' /tmp/record_start.json)" != "true" ]; then
            echo "::error::Could not record the deployment: $(jq -r '.error // "unknown error"' /tmp/record_start.json)"
            exit 1
          fi
          echo "deployment_id=$(jq -r '.deployment_id' /tmp/record_start.json)" >> "$GITHUB_OUTPUT"

      # governance dashboard (spec 004, research.md R-401): the frontend build resolves its API
      # base URL and Cognito Hosted UI parameters at runtime from `window.__CLOUDPULSE_CONFIG__`,
      # since the API Gateway URL isn't known until after `terraform apply` -- which runs after
      # the frontend build step above. Injected into the already-built index.html, not baked in
      # at build time.
      - name: Inject runtime config into the frontend build
        env:
          API_BASE_URL: ${{ steps.apply.outputs.api_endpoint }}
          COGNITO_DOMAIN: ${{ steps.apply.outputs.cognito_hosted_ui_domain }}
          COGNITO_CLIENT_ID: ${{ steps.apply.outputs.cognito_client_id }}
          COGNITO_REDIRECT_URI: ${{ steps.apply.outputs.frontend_url }}/auth/callback
        run: |
          CONFIG_JSON=$(jq -nc \
            --arg apiBaseUrl "$API_BASE_URL" \
            --arg cognitoDomain "$COGNITO_DOMAIN" \
            --arg cognitoClientId "$COGNITO_CLIENT_ID" \
            --arg cognitoRedirectUri "$COGNITO_REDIRECT_URI" \
            '{apiBaseUrl:$apiBaseUrl,cognitoDomain:$cognitoDomain,cognitoClientId:$cognitoClientId,cognitoRedirectUri:$cognitoRedirectUri}')
          python3 - "$CONFIG_JSON" <<'PY'
          import sys
          config_json = sys.argv[1]
          path = "frontend/dist/cloudpulse/browser/index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()
          script = f"<script>window.__CLOUDPULSE_CONFIG__ = {config_json};</script></head>"
          if "</head>" not in html:
              raise SystemExit(f"{path}: no </head> found to inject into")
          html = html.replace("</head>", script, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          PY

      # T003a: the `application` builder always nests real output under `browser/`, regardless of
      # the configured `outputPath` -- syncing the parent left `index.html` unreachable at the
      # CloudFront root (`default_root_object = "index.html"`) through this pipeline until now.
      - name: Publish the frontend
        run: |
          aws s3 sync frontend/dist/cloudpulse/browser "s3://${{ steps.apply.outputs.frontend_bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.apply.outputs.cloudfront_id }}" --paths "/*"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ steps.apply.outputs.api_endpoint }}/health" | jq -e '.status == "healthy"'; then
              exit 0
            fi
            sleep 6
          done
          echo "::error::/health did not report healthy after deployment"
          exit 1

      # spec 004 T041/FR-026: the dashboard's own smoke suite (T039), pointed at the
      # real deployed frontend origin instead of a local server (playwright.config.ts's
      # E2E_BASE_URL). Its API calls stay route-intercepted, same as every other e2e
      # spec in this suite (research.md's established pattern) -- this proves the
      # deployed JS bundle and static assets actually boot, route, and render
      # correctly (T003a's own bug was exactly this class, caught only by loading a
      # page in a browser), not that a real connected AWS account round-trips
      # end-to-end -- that stays T032's job, deliberately not duplicated here.
      - name: Dashboard smoke test (real dev origin)
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ steps.apply.outputs.frontend_url }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/dashboard-smoke.spec.ts

      # --- Close the record, on success AND on failure (FR-021) --------
      # `if: always()` is load-bearing: leaving a row in `running` fails FR-021's third
      # condition, and a stuck record is indistinguishable from one still in progress.
      - name: Record deployment outcome
        if: always() && steps.record_start.outputs.deployment_id != ''
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo succeeded || echo failed)
          aws lambda invoke --function-name "${{ steps.apply.outputs.migrate_function }}" \
            --cli-binary-format raw-in-base64-out \
            --payload "$(jq -nc --arg id "${{ steps.record_start.outputs.deployment_id }}" \
              --arg st "$STATUS" '{command:"record_finish",deployment_id:$id,status:$st}')" \
            /tmp/record_finish.json
          cat /tmp/record_finish.json
